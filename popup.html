<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Outstanding Balances</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Theme toggle (upper‐left) -->
  <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">🌙</button>

  <!-- Share report button (to left of Download) -->
  <button id="share-btn" class="share-btn" aria-label="Share report">📧</button>

  <!-- CSV download (upper‐right) -->
  <button id="download-csv" class="download-btn" aria-label="Download CSV">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
  </button>

  <h1>Outstanding Balances</h1>
  <div id="list" class="list">
    Click the icon while you’re on the 
    <a href="https://payments.apartments.com/leases/#!/current-and-upcoming"
       target="_blank" rel="noopener">Apts.com Payments page</a>...
  </div>
  <script src="popup.js"></script>
</body>
</html>
